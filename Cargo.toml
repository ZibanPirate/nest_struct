[package]
name = "nest_struct"
version = "0.5.6"
edition = "2021"
authors = ["ZibanPirate <zakman.dev@gmail.com>"]
description = "Nest struct and enum definitions with minimal syntax changes"
license = "MIT"
repository = "https://github.com/ZibanPirate/nest_struct"
readme = "README.md"
keywords = ["nest", "struct", "enum", "macro"]
categories = [
    "data-structures",
    "development-tools",
    "rust-patterns",
    "web-programming",
]

[dependencies]
convert_case = "0.12"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }

[dev-dependencies]
# todo-zm: upstream this patch of macrotest
macrotest = { git = "https://github.com/ZibanPirate/macrotest", branch = "feat/source-suffix" }
trybuild = "1.0.122"
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
proc-macro = true
path = "src/lib.rs"
