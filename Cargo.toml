[package]
name = "nest_struct"
version = "0.5.6"
edition = "2021"
authors = ["ZibanPirate <zakman.dev@gmail.com>"]
description = "Nest struct and enum definitions with minimal syntax changes"
license = "MIT"
repository = "https://github.com/ZibanPirate/nest_struct"
readme = "README.md"
keywords = ["nest", "struct", "enum", "macro"]
categories = [
    "data-structures",
    "development-tools",
    "rust-patterns",
    "web-programming",
]

[dependencies]
heck = "0.5"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }

[dev-dependencies]
# todo-zm: upstream this patch of macrotest
macrotest = { git = "https://github.com/ZibanPirate/macrotest", rev = "2caa25727ce5197c4ffe86ac38899f8a3869ecc2" }
trybuild = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
proc-macro = true
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
ptr_arg = "warn"
too_many_arguments = "warn"
